name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 2026-10-25：spec 已对齐当前 UI（布局收进「更多」菜单、首页入口改「联机」），
    # 本地连续两轮 `npx playwright test` 6/6 全绿且首跑无 flake（3.5 分钟），此 job 改为必需门禁：失败即阻断合并
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          # 配置里 reporter 只有 list，失败产物实际落在 test-results/（trace+截图+error-context）；
          # 只写 playwright-report/ 会让这一步在失败时因目录不存在而报错、拿不到任何现场
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7
